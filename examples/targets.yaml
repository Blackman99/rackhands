# ~/.config/rackhands/targets.yaml  (or $RACKHANDS_CONFIG)
defaults:
  username: rackhands-ro          # a read-only BMC account is enough for every read command
  password_env: BMC_PASSWORD      # or password_file: ~/.config/rackhands/bmc.pass
  timeout: 20s
  wait_timeout: 30m               # how long --wait follows a firmware task before giving up watching
  # insecure: true is the default because BMCs ship self-signed certificates.
  # Prefer tls_fingerprint: (SHA-256 of the leaf cert) over insecure: true —
  # get it with: rackhands tls-fingerprint TARGET
  # Or set ca_file + insecure: false for a real PKI.

targets:
  - name: db-01
    redfish: https://10.20.0.11   # Dell iDRAC9
    ipmi: 10.20.0.11              # fallback when Redfish is down or missing a feature
    tags: [prod, db]
    allow: [power, firmware]      # second key: this box may be power-cycled / flashed (with --allow ...)
    wait_timeout: 45m             # per-target override for a slow flash

  - name: web-07
    redfish: https://10.20.0.27   # HPE iLO 5
    tags: [prod, web]

  - name: k8s-12
    redfish: https://10.20.1.12   # Lenovo XCC
    session_auth: true            # one session per run instead of Basic auth per request
    ca_file: /etc/ssl/bmc-ca.pem
    insecure: false

  - name: lab-idrac
    redfish: https://192.168.88.50
    # Pin the self-signed leaf instead of insecure: true (pin wins over insecure/ca_file).
    tls_fingerprint: "aa:bb:cc:dd:ee:ff:00:11:22:33:44:55:66:77:88:99:aa:bb:cc:dd:ee:ff:00:11:22:33:44:55:66:77:88:99"

  - name: lab-x10
    ipmi: 192.168.88.40           # pre-Redfish Supermicro X10: IPMI only
    username: ADMIN
    password_file: ~/.config/rackhands/lab.pass
    allow: [power, boot]

# audit_log: ~/.local/state/rackhands/audit.jsonl
