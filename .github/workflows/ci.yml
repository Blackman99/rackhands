name: CI
on:
  push: {branches: [main]}
  pull_request:
permissions: {contents: read}
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with: {go-version-file: go.mod}
      - run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test -race ./...
      - name: cross-compile
        run: for os in linux darwin windows; do GOOS=$os CGO_ENABLED=0 go build -o /dev/null ./cmd/rackhands; done
  integration:
    # DMTF Redfish-Mockup-Server (DMTF + Dell/HPE/Lenovo/Supermicro mockups) and OpenIPMI ipmi_sim
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with: {go-version-file: go.mod}
      - uses: actions/checkout@v5
        with: {repository: DMTF/Redfish-Mockup-Server, ref: '1.3.0', path: .rms}
      - run: pip install requests grequests multipart
      - run: sudo apt-get update && sudo apt-get install -y openipmi jq
      - run: go build -o rackhands ./cmd/rackhands
      - run: RMS_DIR=$PWD/.rms ./test/integration.sh
